name: supare
description: A private, offline task manager and encrypted family document wallet.
publish_to: none
version: 1.0.0+1
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  cryptography: ^2.7.0
  pointycastle: ^4.0.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  uuid: ^4.5.1
  intl: ^0.20.2
  file_picker: ^10.3.3
  share_plus: ^11.1.0
  cross_file: ^0.3.4+2
  image_picker: ^1.2.0
  image: ^4.5.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.6
flutter:
  uses-material-design: true
